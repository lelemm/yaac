# Built separately against the staged CEF SDK. The ordinary workspace needs no CEF files.
[workspace]

[package]
name = "yaac-preview-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Use our verified runtime distribution and explicit linkage in build.rs.
cef = { version = "=156.7.0", default-features = false, features = ["dox"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
