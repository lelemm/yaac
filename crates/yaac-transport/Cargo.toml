[package]
name = "yaac-transport"
description = "YAAC transports: the Connector abstraction, the local and WSL connectors, and stage 0 (the in-band bootstrap)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "1.43", default-features = false, features = ["process", "io-util", "rt", "time", "sync"] }
thiserror.workspace = true
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
tokio = { version = "1.43", default-features = false, features = ["process", "io-util", "rt", "macros", "time"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
