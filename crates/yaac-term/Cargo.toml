[package]
name = "yaac-term"
description = "Renderer-neutral terminal emulator core (alacritty_terminal): grid, damage snapshots, key encoding (docs/13-terminal.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Alacritty's own parser and grid (Apache-2.0), P334. No serde.
alacritty_terminal = { version = "0.26.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
# Only for `examples/record.rs`, which records the test fixtures from real programs.
portable-pty = "0.9.0"
