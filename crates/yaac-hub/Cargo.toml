[package]
name = "yaac-hub"
description = "The YAAC hub: the one connection to each target, reconnection with replay, the host cache, the durable draft store, the attach server, and the mesh relay queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
yaac-protocol = { path = "../yaac-protocol" }
yaac-transport = { path = "../yaac-transport" }
chrono = { version = "0.4.42", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.43", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fs4 = { version = "0.12", default-features = false, features = ["sync"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
yaac-winsys = { path = "../yaac-winsys" }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

[dev-dependencies]
tokio = { version = "1.43", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tempfile = "3.10"

[lints]
workspace = true
