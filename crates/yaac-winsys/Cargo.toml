[package]
name = "yaac-winsys"
description = "The only place YAAC calls the Windows API directly: console attach, the user's SID, the attach pipe's access control, the per-user Run registry value, and the window's single-instance event. Empty on other platforms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.43", default-features = false, features = ["net"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids `unsafe`; this crate exists to hold the few FFI calls Windows needs,
# so it repeats the workspace lints except that one, and asks for a SAFETY comment on each
# unsafe block instead.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
semicolon_if_nothing_returned = "warn"
cast_possible_truncation = "warn"
