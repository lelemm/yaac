[package]
name = "yaac-app"
description = "The `yaac` binary: the window (egui), and `yaac hub` (headless)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yaac_app"
path = "src/lib.rs"

[[bin]]
name = "yaac"
path = "src/main.rs"

[features]
default = ["glow", "hub"]
# The real hub: `yaac hub` and attaching to it. Without it the binary runs only `--demo`
# (a window-only build for UI work).
hub = ["dep:yaac-hub"]
# OpenGL renderer: the default (smaller and lighter, docs/02-architecture.md#footprint-budget).
glow = ["eframe/glow"]
# wgpu renderer, kept behind a feature.
wgpu = ["eframe/wgpu"]

[dependencies]
yaac-core = { path = "../yaac-core" }
yaac-protocol = { path = "../yaac-protocol" }
yaac-hub = { path = "../yaac-hub", optional = true }
serde_json.workspace = true
# `clipboard`: the system clipboard for copy and plain-text paste (egui-winit's arboard and,
# on Wayland, smithay-clipboard).
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "accesskit", "wayland", "x11", "clipboard"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
png = "0.17"
# The host's local UTC offset (D91: every time shown is in the local zone). Only the `clock`
# feature: chrono plus iana-time-zone; no serde, no formatting tables.
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# Rasterises the two harness logos (SVG path data) into alpha masks; no dependencies.
zeno = { version = "0.3.3", default-features = false, features = ["eval", "std"] }
# Attachments (docs/06-attachments.md), all used on worker threads only:
# the system file picker (Windows: the common item dialog; Linux: the XDG desktop portal over
# D-Bus, no GTK);
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# the clipboard's file list (`CF_HDROP`; `text/uri-list` on X11 and Wayland), image and text;
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
# thumbnails decoded at display size (the formats the MVP sends as images);
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# clipboard bytes go to the hub's draft store in base64 chunks.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
yaac-winsys = { path = "../yaac-winsys" }

[build-dependencies]
# The Windows icon resource's 256 px image (build.rs).
png = "0.17"

[dev-dependencies]
tempfile = "3.10"
yaac-transport = { path = "../yaac-transport" }

[lints]
workspace = true
