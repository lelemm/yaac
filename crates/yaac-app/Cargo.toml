[package]
name = "yaac-app"
description = "The `yaac` binary: the window (egui), and `yaac hub` (headless)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yaac_app"
path = "src/lib.rs"

[[bin]]
name = "yaac"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop", "glow", "wgpu", "hub"]
# The desktop window and what it asks of a desktop OS: eframe and winit, the file dialogs
# (rfd), the system clipboard (arboard), the system font scan, the updater's HTTPS client
# (ureq). Without it the crate builds only the window controller that the WPF and
# Android front ends drive (`view_protocol`); each missing piece is a hook in `platform`.
# `yaac-android` builds it with `default-features = false, features = ["hub"]`.
desktop = ["dep:eframe", "dep:rfd", "dep:arboard", "dep:ureq", "dep:cpal"]
# The real hub: `yaac hub` and attaching to it. Without it the binary runs only `--demo`
# (a window-only build for UI work).
hub = ["dep:yaac-hub"]
preview = ["desktop", "dep:yaac-preview"]
# Both renderers are built in and chosen at start (D128, docs/02-architecture.md#the-renderer):
# OpenGL through glow, the default (smaller and lighter);
glow = ["desktop", "eframe/glow"]
# wgpu on Direct3D 12, Vulkan or OpenGL, and the software adapters (WARP on Windows) that
# the window falls back to when the chosen renderer cannot start.
wgpu = ["desktop", "eframe/wgpu", "dep:pollster"]

[dependencies]
tempfile = "3.10"
yaac-code = { path = "../yaac-code" }
yaac-term = { path = "../yaac-term" }
yaac-preview = { path = "../yaac-preview", optional = true }
yaac-core = { path = "../yaac-core" }
yaac-protocol = { path = "../yaac-protocol" }
yaac-hub = { path = "../yaac-hub", optional = true }
serde.workspace = true
serde_json.workspace = true
url = "2.5"
# `clipboard`: the system clipboard for copy and plain-text paste (egui-winit's arboard and,
# on Wayland, smithay-clipboard).
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "accesskit", "wayland", "x11", "clipboard"], optional = true }
# The UI library itself (pure Rust; eframe re-exports this same crate). The controller runs
# egui's `Context` without a window, so it is needed in every build.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
png = "0.17"
# The host's local UTC offset (D91: every time shown is in the local zone). Only the `clock`
# feature: chrono plus iana-time-zone; no serde, no formatting tables.
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# Rasterises the two harness logos (SVG path data) into alpha masks; no dependencies.
zeno = { version = "0.3.3", default-features = false, features = ["eval", "std"] }
# Attachments (docs/06-attachments.md), all used on worker threads only:
# the system file picker (Windows: the common item dialog; Linux: the XDG desktop portal over
# D-Bus, no GTK);
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"], optional = true }
# the clipboard's file list (`CF_HDROP`; `text/uri-list` on X11 and Wayland), image and text;
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"], optional = true }
# thumbnails decoded at display size (the formats the MVP sends as images);
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# clipboard bytes go to the hub's draft store in base64 chunks.
base64 = "0.22"
# The in-app updater (D136, `updater`, worker threads only): one HTTPS client for GitHub's
# latest release and the installer download. rustls on ring with the webpki root store, so it
# cross-compiles to x86_64-pc-windows-gnu with no OpenSSL and no system TLS; no gzip, cookies,
# or JSON features (serde_json parses). Only a Windows build ever calls it.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
# The installer's SHA-256, checked against the release manifest (already used by the hub).
sha2 = "0.10"
pollster = { version = "1.0.3", optional = true }
# Font discovery and import (`fonts`). Pure Rust; only the desktop scans the system's fonts.
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }

[target.'cfg(windows)'.dependencies]
yaac-winsys = { path = "../yaac-winsys" }
# The notification-area icon and its menu (D127). Windows only: no Linux backend is built
# (its GTK one would pull in GTK; see docs/07-ui.md#the-tray).
tray-icon = { version = "0.26.1", default-features = false }
# The microphone for voice input in the controller (`voice_capture`, its own thread): WASAPI.
# Windows and `desktop` only; Android records in its own renderer, and nothing else records.
cpal = { version = "0.17.3", default-features = false, optional = true }

[build-dependencies]
# The Windows icon resource's 256 px image (build.rs).
png = "0.17"

[dev-dependencies]
yaac-transport = { path = "../yaac-transport" }

[lints]
workspace = true
