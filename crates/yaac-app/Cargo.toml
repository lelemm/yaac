[package]
name = "yaac-app"
description = "The `yaac` binary: the window (egui), and `yaac hub` (headless)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yaac_app"
path = "src/lib.rs"

[[bin]]
name = "yaac"
path = "src/main.rs"

[features]
default = ["glow", "hub"]
# The real hub: `yaac hub` and attaching to it. Without it the binary runs only `--demo`
# (a window-only build for UI work).
hub = ["dep:yaac-hub"]
# OpenGL renderer: the default (smaller and lighter, docs/02-architecture.md#footprint-budget).
glow = ["eframe/glow"]
# wgpu renderer, kept behind a feature.
wgpu = ["eframe/wgpu"]

[dependencies]
yaac-core = { path = "../yaac-core" }
yaac-protocol = { path = "../yaac-protocol" }
yaac-hub = { path = "../yaac-hub", optional = true }
serde_json.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "accesskit", "wayland", "x11"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
png = "0.17"
# The host's local UTC offset (D91: every time shown is in the local zone). Only the `clock`
# feature: chrono plus iana-time-zone; no serde, no formatting tables.
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
# Rasterises the two harness logos (SVG path data) into alpha masks; no dependencies.
zeno = { version = "0.3.3", default-features = false, features = ["eval", "std"] }

[dev-dependencies]
tempfile = "3.10"
yaac-transport = { path = "../yaac-transport" }

[lints]
workspace = true
